{% extends 'base.html' %}

{% block title %}บันทึกสินค้า | IRNsport Stock{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="mb-4 text-center">บันทึกการเบิก/รับสินค้า</h2>

          {% if success %}
            <div class="alert alert-success" role="alert">
              ✅ บันทึกข้อมูลเรียบร้อยแล้ว
            </div>
          {% endif %}

          <form method="POST" action="/borrow" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">วันที่</label>
                <input
                  type="date"
                  class="form-control"
                  name="date"
                  value="{{ today }}"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">ประเภทการทำรายการ</label>
                <select class="form-select" name="action" required>
                  <option value="เบิกสินค้า">เบิกสินค้า</option>
                  <option value="รับเข้าสินค้า">รับเข้าสินค้า</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">รายการสินค้า</label>
                <input type="text" class="form-control" name="item" required />
              </div>

              <div class="col-md-6">
                <label class="form-label">จำนวน (ชิ้น)</label>
                <input
                  type="number"
                  class="form-control"
                  name="qty"
                  min="1"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">อ้างอิงเลขออเดอร์</label>
                <input type="text" class="form-control" name="order_ref" />
              </div>

              <div class="col-md-6">
                <label class="form-label">ชื่อผู้ทำรายการ</label>
                <input type="text" class="form-control" name="user" required />
              </div>

              <div class="col-12">
                <label class="form-label">หมายเหตุ</label>
                <textarea class="form-control" name="note" rows="3"></textarea>
              </div>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-success px-4">บันทึกข้อมูล</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
